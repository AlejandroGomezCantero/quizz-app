<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-8">
            
            <div class="card shadow">
                <div class="card-body p-5">
                    
                    <h2 class="text-center mb-4">📝 Crear Cuenta</h2>

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/registro}" th:object="${usuario}" method="post">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Usuario *</label>
                                <input type="text" class="form-control" th:field="*{username}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre Completo *</label>
                                <input type="text" class="form-control" th:field="*{nombreCompleto}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" th:field="*{email}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contraseña *</label>
                                <input type="password" class="form-control" th:field="*{password}" 
                                       minlength="6" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Confirmar Contraseña *</label>
                                <input type="password" class="form-control" name="confirmarPassword" 
                                       minlength="6" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 btn-lg mt-3">
                            Registrarse
                        </button>

                    </form>

                    <hr>

                    <p class="text-center mb-0">
                        ¿Ya tienes cuenta? 
                        <a th:href="@{/login}">Inicia sesión aquí</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
