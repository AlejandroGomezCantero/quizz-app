<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Preguntas Selección Múltiple - Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>📋 Preguntas Selección Múltiple</h1>
        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/preguntas/seleccion-multiple/nueva}" class="btn btn-warning">
                ➕ Nueva Pregunta
            </a>
        </div>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- FILTROS -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/preguntas/seleccion-multiple}" method="get" class="row g-3">
                <div class="col-md-5">
                    <input type="text" class="form-control"
                           name="texto" th:value="${texto}"
                           placeholder="Buscar por enunciado...">
                </div>
                <div class="col-md-4">
                    <select class="form-select" name="categoriaId">
                        <option value="">Todas las categorías</option>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.id}"
                                th:text="${cat.nombre}"
                                th:selected="${cat.id == categoriaId}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">🔍 Filtrar</button>
                    <a th:href="@{/preguntas/seleccion-multiple}" class="btn btn-secondary">✖ Limpiar</a>
                </div>
            </form>
