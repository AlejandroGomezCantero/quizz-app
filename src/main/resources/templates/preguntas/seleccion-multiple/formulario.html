<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Pregunta Selección Múltiple</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0f; color: #e8e8f0; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .page-wrapper { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .page-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3);
            color: #a5b4fc; padding: 6px 16px; border-radius: 999px;
            font-size: 13px; font-weight: 500; letter-spacing: 0.05em; margin-bottom: 24px;
        }
        .page-title { font-family: 'Syne', sans-serif; font-size: 2.5rem; font-weight: 800; color: #f1f1f8; margin-bottom: 32px; letter-spacing: -0.02em; }
        .dark-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 32px; margin-bottom: 20px; }
        .field-label { font-size: 13px; color: #9ca3af; margin-bottom: 8px; display: block; font-weight: 500; }
        .required { color: #ef4444; margin-left: 2px; }
        .dark-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #e8e8f0; padding: 12px 16px; border-radius: 8px; width: 100%; font-size: 14px; font-family: 'Inter', sans-serif; }
        .dark-input::placeholder { color: #6b7280; }
        .dark-input:focus { outline: none; border-color: rgba(99,102,241,0.5); background: rgba(255,255,255,0.07); }
        .dark-textarea { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #e8e8f0; padding: 12px 16px; border-radius: 8px; width: 100%; font-size: 14px; font-family: 'Inter', sans-serif; resize: vertical; }
        .dark-textarea::placeholder { color: #6b7280; }
        .dark-textarea:focus { outline: none; border-color: rgba(99,102,241,0.5); background: rgba(255,255,255,0.07); }
        .dark-select { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #e8e8f0; padding: 12px 16px; border-radius: 8px; width: 100%; font-size: 14px; }
        .dark-select option { background: #1a1a2e; color: #e8e8f0; }
        .dark-select:focus { outline: none; border-color: rgba(99,102,241,0.5); }
        .field-hint { font-size: 12px; color: #6b7280; margin-top: 6px; }
        .mb-field { margin-bottom: 24px; }
        .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
        .checkbox-option { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 12px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .checkbox-option:has(input:checked) { border-color: rgba(99,102,241,0.4); background: rgba(99,102,241,0.08); }
        .checkbox-option input { accent-color: #6366f1; width: 16px; height: 16px; cursor: pointer; }
        .checkbox-label { font-size: 14px; color: #e8e8f0; cursor: pointer; }
        .btn-save { background: #6366f1; color: white; padding: 12px 32px; border-radius: 8px; font-size: 15px; font-weight: 500; border: none; cursor: pointer; transition: all 0.2s; }
        .btn-save:hover { background: #4f46e5; transform: translateY(-1px); }
        .btn-cancel { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #9ca3af; padding: 12px 32px; border-radius: 8px; font-size: 15px; text-decoration: none; transition: all 0.2s; }
        .btn-cancel:hover { background: rgba(255,255,255,0.05); color: #e8e8f0; }
        .tips-card { background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .tips-title { font-size: 14px; color: #a5b4fc; font-weight: 600; margin-bottom: 12px; }
        .tips-list { list-style: none; padding: 0; margin: 0; }
        .tips-list li { font-size: 13px; color: #6b7280; padding: 4px 0; }
        .tips-list li::before { content: '—'; margin-right: 8px; color: #6366f1; }
        .navbar { background: rgba(10,10,15,0.95) !important; border-bottom: 1px solid rgba(255,255,255,0.06); }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="page-wrapper">

    <div class="page-badge">Selección Múltiple</div>
    <h1 class="page-title" th:text="${titulo}">Nueva Pregunta Selección Múltiple</h1>

    <div class="dark-card">
        <form th:action="@{/preguntas/seleccion-multiple/guardar}"
              th:object="${pregunta}"
              method="post">

            <input type="hidden" th:field="*{id}" />

            <div class="mb-field">
                <label class="field-label">Enunciado <span class="required">*</span></label>
                <textarea class="dark-textarea" id="enunciado" th:field="*{enunciado}" rows="3"
                          placeholder="Ejemplo: ¿Cuáles son lenguajes de programación?"
                          required maxlength="500"></textarea>
            </div>

            <div class="mb-field">
                <label class="field-label">Categoría <span class="required">*</span></label>
                <select class="dark-select" name="categoriaId" required>
                    <option value="">Selecciona una categoría</option>
                    <option th:each="cat : ${categorias}"
                            th:value="${cat.id}"
                            th:text="${cat.nombre}"
                            th:selected="${pregunta.categoria != null and pregunta.categoria.id == cat.id}">
                    </option>
                </select>
            </div>

            <div class="mb-field">
                <label class="field-label">Opción A <span class="required">*</span></label>
                <input type="text" class="dark-input" th:field="*{opcionA}" placeholder="Primera opción" required maxlength="255">
            </div>

            <div class="mb-field">
                <label class="field-label">Opción B <span class="required">*</span></label>
                <input type="text" class="dark-input" th:field="*{opcionB}" placeholder="Segunda opción" required maxlength="255">
            </div>

            <div class="mb-field">
                <label class="field-label">Opción C <span class="required">*</span></label>
                <input type="text" class="dark-input" th:field="*{opcionC}" placeholder="Tercera opción" required maxlength="255">
            </div>

            <div class="mb-field">
                <label class="field-label">Opción D <span class="required">*</span></label>
                <input type="text" class="dark-input" th:field="*{opcionD}" placeholder="Cuarta opción" required maxlength="255">
            </div>

            <div class="mb-field">
                <label class="field-label">Respuestas Correctas <span class="required">*</span></label>
                <p class="field-hint" style="margin-bottom:10px">Marca todas las opciones que son correctas</p>
                <div class="checkbox-group">
                    <label class="checkbox-option">
                        <input type="checkbox" name="respuestasCorrectas" value="A" id="respA"
                               th:checked="${pregunta.respuestasCorrectas != null and #lists.contains(pregunta.respuestasCorrectas, 'A')}">
                        <span class="checkbox-label">Opción A</span>
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" name="respuestasCorrectas" value="B" id="respB"
                               th:checked="${pregunta.respuestasCorrectas != null and #lists.contains(pregunta.respuestasCorrectas, 'B')}">
                        <span class="checkbox-label">Opción B</span>
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" name="respuestasCorrectas" value="C" id="respC"
                               th:checked="${pregunta.respuestasCorrectas != null and #lists.contains(pregunta.respuestasCorrectas, 'C')}">
                        <span class="checkbox-label">Opción C</span>
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" name="respuestasCorrectas" value="D" id="respD"
                               th:checked="${pregunta.respuestasCorrectas != null and #lists.contains(pregunta.respuestasCorrectas, 'D')}">
                        <span class="checkbox-label">Opción D</span>
                    </label>
                </div>
            </div>

            <div class="d-flex gap-3 mt-4">
                <button type="submit" class="btn-save">Guardar</button>
                <a th:href="@{/preguntas/seleccion-multiple}" class="btn-cancel">Cancelar</a>
            </div>

        </form>
    </div>

    <div class="tips-card">
        <p class="tips-title">Consejos</p>
        <ul class="tips-list">
            <li>Marca todas las opciones que sean correctas</li>
            <li>Puede haber 1, 2, 3 o hasta 4 respuestas correctas</li>
            <li>Asegúrate de marcar al menos una opción</li>
        </ul>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>
document.querySelector('form').addEventListener('submit', function(e) {
    const checkboxes = document.querySelectorAll('input[name="respuestasCorrectas"]:checked');
    if (checkboxes.length === 0) {
        e.preventDefault();
        alert('Debes marcar al menos una respuesta correcta');
    }
});
</script>
</body>
</html>
