<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas Verdadero/Falso - Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>📝 Preguntas Verdadero/Falso</h1>
        <a th:href="@{/preguntas/vf/nueva}" class="btn btn-primary">
            ➕ Nueva Pregunta V/F
        </a>
    </div>

    <!-- Mensajes -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <p class="text-muted">
        Total: <strong th:text="${totalElementos}">0</strong> preguntas
    </p>

    <!-- Tabla -->
    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 5%">ID</th>
                            <th style="width: 40%">Enunciado</th>
                            <th style="width: 15%">Categoría</th>
                            <th style="width: 15%">Respuesta</th>
                            <th style="width: 25%">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(preguntas)}">
                            <td colspan="5" class="text-center text-muted">
                                No hay preguntas. ¡Crea una nueva!
                            </td>
                        </tr>
                        
                        <tr th:each="pregunta : ${preguntas}">
                            <td th:text="${pregunta.id}">1</td>
                            <td th:text="${pregunta.enunciado}">La Tierra es redonda</td>
                            <td>
                                <span class="badge bg-info" 
                                      th:text="${pregunta.categoria?.nombre}">Ciencia</span>
                            </td>
                            <td>
                                <span th:if="${pregunta.respuestaCorrecta}" 
                                      class="badge bg-success">✅ Verdadero</span>
                                <span th:unless="${pregunta.respuestaCorrecta}" 
                                      class="badge bg-danger">❌ Falso</span>
                            </td>
                            <td>
                                <a th:href="@{/preguntas/vf/ver/{id}(id=${pregunta.id})}" 
                                   class="btn btn-sm btn-info" title="Ver">
                                    👁️ Ver
                                </a>
                                <a th:href="@{/preguntas/vf/editar/{id}(id=${pregunta.id})}" 
                                   class="btn btn-sm btn-warning" title="Editar">
                                    ✏️
                                </a>
                                <a th:href="@{/preguntas/vf/eliminar/{id}(id=${pregunta.id})}" 
                                   class="btn btn-sm btn-danger" title="Eliminar"
                                   onclick="return confirm('¿Eliminar esta pregunta?')">
                                    🗑️
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Paginación -->
    <nav th:if="${totalPaginas > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${paginaActual == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/preguntas/vf(page=${paginaActual - 1})}">Anterior</a>
            </li>
            <li class="page-item" 
                th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
                th:classappend="${i == paginaActual} ? 'active'">
                <a class="page-link" 
                   th:href="@{/preguntas/vf(page=${i})}" 
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${paginaActual == totalPaginas - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/preguntas/vf(page=${paginaActual + 1})}">Siguiente</a>
            </li>
        </ul>
    </nav>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
