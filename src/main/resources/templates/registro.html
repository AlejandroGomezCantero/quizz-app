<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white text-center py-4">
                    <h2>📝 Crear Cuenta</h2>
                </div>
                <div class="card-body p-4">

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/registro}" th:object="${usuario}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Usuario *</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{username}"
                                       placeholder="Mínimo 4 caracteres"
                                       minlength="4"
                                       required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Nombre Completo *</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{nombreCompleto}"
                                       placeholder="Tu nombre real"
                                       required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Email *</label>
                            <input type="email"
                                   class="form-control"
                                   th:field="*{email}"
                                   placeholder="tu@email.com"
                                   required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Contraseña *</label>
                                <input type="password"
                                       class="form-control"
                                       th:field="*{password}"
                                       placeholder="Mínimo 6 caracteres"
                                       minlength="6"
                                       required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Confirmar Contraseña *</label>
                                <input type="password"
                                       class="form-control"
                                       name="confirmarPassword"
                                       placeholder="Repite la contraseña"
                                       minlength="6"
                                       required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 btn-lg mt-2">
                            ✅ Crear Cuenta
                        </button>
                    </form>

                    <hr>
                    <p class="text-center mb-0">
                        ¿Ya tienes cuenta?
                        <a th:href="@{/login}" class="fw-bold">Inicia sesión aquí</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
