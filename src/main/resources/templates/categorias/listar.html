<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Categorías - Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Categorías</h1>
        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/categorias/nueva}" class="btn btn-primary">
                ➕ Nueva Categoría
            </a>
        </div>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <p class="text-muted">Total: <strong th:text="${totalElementos}">0</strong> categorías</p>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(categorias)}">
                            <td colspan="4" class="text-center text-muted">
                                No hay categorías. ¡Crea una nueva!
                            </td>
                        </tr>
                        <tr th:each="categoria : ${categorias}">
                            <td th:text="${categoria.id}">1</td>
                            <td><strong th:text="${categoria.nombre}">Historia</strong></td>
                            <td th:text="${categoria.descripcion}">Descripción</td>
                            <td sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/categorias/editar/{id}(id=${categoria.id})}"
                                   class="btn btn-sm btn-warning">✏️ Editar</a>
                                <a th:href="@{/categorias/eliminar/{id}(id=${categoria.id})}"
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('¿Estás seguro?')">🗑️ Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav th:if="${totalPaginas > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${paginaActual == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/categorias(page=${paginaActual - 1})}">Anterior</a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
                th:classappend="${i == paginaActual} ? 'active'">
                <a class="page-link" th:href="@{/categorias(page=${i})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${paginaActual == totalPaginas - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/categorias(page=${paginaActual + 1})}">Siguiente</a>
            </li>
        </ul>
    </nav>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
