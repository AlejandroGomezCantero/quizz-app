<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Quiz App'">Categoría - Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0a0f;
            color: #e8e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .navbar { background: rgba(10,10,15,0.95) !important; border-bottom: 1px solid rgba(255,255,255,0.06); }

        .page-wrapper {
            max-width: 680px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        /* Header */
        .page-header {
            margin-bottom: 36px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6b7280;
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 20px;
            transition: color 0.15s;
        }
        .back-link:hover { color: #a5b4fc; text-decoration: none; }

        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: #f1f1f8;
            letter-spacing: -0.02em;
        }

        /* Card formulario */
        .form-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 20px;
        }

        /* Labels */
        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #9ca3af;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }
        .field-label .required {
            color: #f87171;
            margin-left: 3px;
        }

        /* Inputs */
        .field-input,
        .field-textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 14px;
            color: #e8e8f0;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            outline: none;
        }
        .field-input::placeholder,
        .field-textarea::placeholder { color: #4b5563; }

        .field-input:focus,
        .field-textarea:focus {
            border-color: rgba(99,102,241,0.5);
            background: rgba(99,102,241,0.05);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }

        .field-textarea { resize: vertical; min-height: 90px; }

        .field-hint {
            font-size: 12px;
            color: #4b5563;
            margin-top: 6px;
        }

        .field-group { margin-bottom: 22px; }
        .field-group:last-child { margin-bottom: 0; }

        /* Botones */
        .btn-area {
            display: flex;
            gap: 10px;
            margin-top: 28px;
        }

        .btn-save {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #6366f1;
            color: white;
            padding: 11px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-save:hover {
            background: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99,102,241,0.3);
        }

        .btn-cancel {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: #9ca3af;
            padding: 11px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 400;
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-cancel:hover {
            background: rgba(255,255,255,0.05);
            color: #e8e8f0;
            border-color: rgba(255,255,255,0.2);
            text-decoration: none;
        }

        /* Info box */
        .info-box {
            background: rgba(99,102,241,0.08);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 10px;
            padding: 18px 20px;
        }
        .info-box-title {
            font-size: 13px;
            font-weight: 500;
            color: #a5b4fc;
            margin-bottom: 10px;
        }
        .info-box ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .info-box li {
            font-size: 13px;
            color: #6b7280;
            padding-left: 16px;
            position: relative;
        }
        .info-box li::before {
            content: '·';
            position: absolute;
            left: 4px;
            color: #6366f1;
        }

        footer { border-top: 1px solid rgba(255,255,255,0.06); }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="page-wrapper">

    <div class="page-header">
        <a th:href="@{/categorias}" class="back-link">← Volver a categorías</a>
        <h1 class="page-title" th:text="${titulo}">Nueva Categoría</h1>
    </div>

    <div class="form-card">
        <form th:action="@{/categorias/guardar}"
              th:object="${categoria}"
              method="post">

            <input type="hidden" th:field="*{id}" />

            <div class="field-group">
                <label for="nombre" class="field-label">
                    Nombre <span class="required">*</span>
                </label>
                <input type="text"
                       class="field-input"
                       id="nombre"
                       th:field="*{nombre}"
                       placeholder="Ej: Historia, Ciencia, Deportes..."
                       required
                       maxlength="255">
                <p class="field-hint">Debe ser único en el sistema</p>
            </div>

            <div class="field-group">
                <label for="descripcion" class="field-label">Descripción</label>
                <textarea class="field-textarea"
                          id="descripcion"
                          th:field="*{descripcion}"
                          placeholder="Describe brevemente de qué tratan las preguntas de esta categoría..."
                          maxlength="500"></textarea>
                <p class="field-hint">Opcional · máximo 500 caracteres</p>
            </div>

            <div class="btn-area">
                <button type="submit" class="btn-save">Guardar</button>
                <a th:href="@{/categorias}" class="btn-cancel">Cancelar</a>
            </div>

        </form>
    </div>

   

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
