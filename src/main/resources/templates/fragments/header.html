<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">
            <strong>QuizApp</strong>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Inicio</a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        Preguntas
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/preguntas/vf}">Verdadero/Falso</a></li>
                        <li><a class="dropdown-item" th:href="@{/preguntas/seleccion-unica}">Selección Única</a></li>
                        <li><a class="dropdown-item" th:href="@{/preguntas/seleccion-multiple}">Selección Múltiple</a></li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/categorias}">Categorías</a>
                </li>

         

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/swagger-ui.html}" target="_blank">API Docs</a>
                </li>
            </ul>

            <!-- Derecha: usuario y cerrar sesión -->
            <ul class="navbar-nav ms-auto">
                <!-- Mostrar usuario logado -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="navbar-text text-white me-3">
                         <span sec:authentication="name"></span>
                        <span sec:authorize="hasRole('ADMIN')"
                              class="badge bg-danger ms-1">ADMIN</span>
                        <span sec:authorize="hasRole('USER')"
                              class="badge bg-secondary ms-1">USER</span>
                    </span>
                </li>

                <!-- Cerrar sesión con POST -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            Cerrar Sesión
                        </button>
                    </form>
                </li>

                <!-- Mostrar login si no está autenticado -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">Iniciar Sesión</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
